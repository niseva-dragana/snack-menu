<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мени со цени</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: sticky shelf of category tabs + search, then a grid of product cards, each with a yellow shelf price tag. */
  --paper: #eef2f9;
  --card: #ffffff;
  --ink: #12203d;
  --muted: #5a6885;
  --line: #d9e0ee;
  --accent: #1d4ed8;
  --accent-ink: #ffffff;
  --tag: #ffd43b;
  --tag-ink: #1a1505;
  --frame: #ffffff;
  --ph-drinks: #dbe7ff;
  --ph-sweets: #f7e3d6;
  --ph-salty: #ffe0d6;
  --ph-ink: #12203d;
  --shadow: 0 1px 2px rgba(18, 32, 61, .06), 0 6px 18px rgba(18, 32, 61, .06);
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --body: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d1424;
    --card: #162038;
    --ink: #eef2fb;
    --muted: #9aa8c4;
    --line: #26324f;
    --accent: #6d95ff;
    --accent-ink: #0b1430;
    --tag: #ffd43b;
    --tag-ink: #1a1505;
    --frame: #f4f6fa;
    --ph-drinks: #22325a;
    --ph-sweets: #3a2b2a;
    --ph-salty: #43282a;
    --ph-ink: #eef2fb;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 22px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d1424;
  --card: #162038;
  --ink: #eef2fb;
  --muted: #9aa8c4;
  --line: #26324f;
  --accent: #6d95ff;
  --accent-ink: #0b1430;
  --tag: #ffd43b;
  --tag-ink: #1a1505;
  --frame: #f4f6fa;
  --ph-drinks: #22325a;
  --ph-sweets: #3a2b2a;
  --ph-salty: #43282a;
  --ph-ink: #eef2fb;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 22px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; display: block; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }

header.top { padding: 28px 0 18px; }
.brand { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
h1 {
  font-family: var(--display);
  font-weight: 800;
  font-size: clamp(32px, 7vw, 52px);
  line-height: 1;
  letter-spacing: -0.02em;
  margin: 0;
  text-wrap: balance;
}
h1 span { color: var(--accent); }
.sub { color: var(--muted); font-weight: 600; margin: 8px 0 0; }
.legend {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 14px; font-weight: 700; color: var(--muted);
}

.bar {
  position: sticky; top: 0; z-index: 5;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.bar .wrap { display: flex; flex-direction: column; gap: 10px; padding-top: 10px; padding-bottom: 12px; }
.search { position: relative; }
.search label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.search input {
  width: 100%;
  font: 600 16px var(--body);
  color: var(--ink);
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 12px;
  padding: 12px 14px 12px 42px;
  outline: none;
}
.search input::placeholder { color: var(--muted); font-weight: 500; }
.search input:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.tabs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto;
  font: 700 14px var(--body);
  color: var(--ink);
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 999px;
  padding: 8px 14px;
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px;
}
.tab .n { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 600; }
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab[aria-pressed="true"] .n { color: inherit; opacity: .8; }
.tab:focus-visible, .chip:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 2px; }

main { padding: 18px 0 48px; display: flex; flex-direction: column; gap: 34px; }
section h2 {
  font-family: var(--display);
  font-weight: 700;
  font-size: 22px;
  margin: 0 0 14px;
  display: flex; align-items: baseline; gap: 10px;
}
section h2 small { font: 600 14px var(--body); color: var(--muted); }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
  gap: 14px;
}
@media (max-width: 420px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
}

.card {
  background: var(--card);
  border-radius: 16px;
  box-shadow: var(--shadow);
  overflow: hidden;
  display: flex; flex-direction: column;
}
.photo { position: relative; aspect-ratio: 1 / 1; background: var(--frame); }
.photo img { width: 100%; height: 100%; object-fit: contain; }
.ph {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  color: var(--ph-ink);
  font-family: var(--display); font-weight: 800;
  font-size: clamp(30px, 9vw, 44px);
  letter-spacing: -0.02em;
}
.ph[data-cat="drinks"] { background: var(--ph-drinks); }
.ph[data-cat="sweets"] { background: var(--ph-sweets); }
.ph[data-cat="salty"]  { background: var(--ph-salty); }
.ph::after {
  content: "";
  position: absolute; inset: 10px;
  border: 2px dashed color-mix(in srgb, var(--ph-ink) 18%, transparent);
  border-radius: 10px;
}

.price {
  position: absolute; right: 8px; bottom: 8px;
  background: var(--tag); color: var(--tag-ink);
  border-radius: 8px 8px 8px 8px;
  padding: 4px 9px 5px 10px;
  display: flex; align-items: baseline; gap: 3px;
  box-shadow: 0 2px 6px rgba(0, 0, 0, .18);
  font-variant-numeric: tabular-nums;
}
.price b { font: 800 22px/1 var(--display); letter-spacing: -0.03em; }
.price i { font: 800 12px/1 var(--body); font-style: normal; text-transform: lowercase; }

.info { padding: 11px 12px 13px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.name { font-weight: 800; font-size: 15.5px; line-height: 1.25; margin: 0; overflow-wrap: anywhere; }
.note { font-size: 13px; color: var(--muted); font-weight: 600; margin: -4px 0 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }
.chip {
  font: 700 12px var(--body);
  color: var(--ink);
  background: transparent;
  border: 1.5px solid var(--line);
  border-radius: 999px;
  padding: 4px 9px;
  cursor: pointer;
}
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }

.empty { text-align: center; color: var(--muted); font-weight: 600; padding: 40px 0; }
footer { color: var(--muted); font-size: 13px; font-weight: 600; padding: 0 0 32px; }

@media (prefers-reduced-motion: no-preference) {
  .photo img { transition: opacity .18s ease; }
  .tab, .chip { transition: background-color .15s, color .15s, border-color .15s; }
}
</style>
</head>

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
const initials = n => n.replace(/[^\p{L}\p{N} ]/gu, " ").split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase();

let current = "all";
let query = "";

function card(it, idx) {
  const photos = it.img || [];
  const first = photos[0];
  const photo = first
    ? `<img src="${esc(first.s)}" alt="${esc(it.n)}${first.l ? " " + esc(first.l) : ""}" loading="lazy" width="520" height="520">`
    : `<div class="ph" data-cat="${it.c}" aria-hidden="true">${esc(initials(it.n))}</div>`;
  const chips = photos.length > 1
    ? `<div class="chips" role="group" aria-label="Вкусови">${photos.map((ph, i) =>
        `<button type="button" class="chip" id="chip-${idx}-${i}" data-item="${idx}" data-i="${i}" aria-pressed="${i === 0}">${esc(ph.l)}</button>`).join("")}</div>`
    : "";
  return `<article class="card" data-idx="${idx}">
    <div class="photo">${photo}
      <div class="price" aria-label="${it.p} денари"><b>${it.p}</b><i>ден</i></div>
    </div>
    <div class="info">
      <p class="name">${esc(it.n)}</p>
      ${it.note ? `<p class="note">${esc(it.note)}</p>` : ""}
      ${chips}
    </div>
  </article>`;
}

function matches(it) {
  if (!query) return true;
  const hay = (it.n + " " + (it.k || "") + " " + (it.note || "") + " " + (it.img || []).map(x => x.l).join(" ")).toLowerCase();
  return query.split(/\s+/).every(w => hay.includes(w));
}

function render() {
  const menu = $("#menu");
  let shown = 0;
  menu.innerHTML = CATS.filter(c => current === "all" || current === c.id).map(c => {
    const list = ITEMS.map((it, i) => [it, i]).filter(([it]) => it.c === c.id && matches(it));
    shown += list.length;
    if (!list.length) return "";
    return `<section aria-labelledby="h-${c.id}">
      <h2 id="h-${c.id}">${c.title}<small>${list.length}</small></h2>
      <div class="grid">${list.map(([it, i]) => card(it, i)).join("")}</div>
    </section>`;
  }).join("");
  $("#empty").hidden = shown > 0;
}

function renderTabs() {
  const all = [{ id: "all", title: "Сè" }, ...CATS];
  $("#tabs").innerHTML = all.map(c => {
    const n = c.id === "all" ? ITEMS.length : ITEMS.filter(it => it.c === c.id).length;
    return `<button type="button" class="tab" id="tab-${c.id}" data-cat="${c.id}" aria-pressed="${c.id === current}">${c.title}<span class="n">${n}</span></button>`;
  }).join("");
}

$("#tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab");
  if (!b) return;
  current = b.dataset.cat;
  renderTabs();
  render();
});

$("#q").addEventListener("input", e => {
  query = e.target.value.trim().toLowerCase();
  render();
});

$("#menu").addEventListener("click", e => {
  const b = e.target.closest(".chip");
  if (!b) return;
  const it = ITEMS[+b.dataset.item];
  const ph = it.img[+b.dataset.i];
  const cardEl = b.closest(".card");
  let img = $("img", cardEl);
  if (!img) {
    img = document.createElement("img");
    img.width = 520; img.height = 520;
    $(".ph", cardEl).replaceWith(img);
  }
  img.removeAttribute("data-retried");
  img.src = ph.s;
  img.alt = it.n + " " + ph.l;
  cardEl.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b));
});

// If a photo fails to load, retry it once; if it still fails, show the initials tile instead of a broken icon.
$("#menu").addEventListener("error", e => {
  const img = e.target;
  if (img.tagName !== "IMG") return;
  if (!img.dataset.retried) {
    img.dataset.retried = "1";
    img.src = img.src.split("?")[0] + "?r=" + Date.now();
    return;
  }
  const it = ITEMS[+img.closest(".card").dataset.idx];
  const ph = document.createElement("div");
  ph.className = "ph";
  ph.dataset.cat = it.c;
  ph.setAttribute("aria-hidden", "true");
  ph.textContent = initials(it.n);
  img.replaceWith(ph);
}, true);

$("#summary").textContent = `${ITEMS.length} производи · пијалоци, слатко и солено`;
renderTabs();
render();
</script>
</body>
</html>
